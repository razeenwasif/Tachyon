name: Tachyon
options:
  bundleIdPrefix: dev.tachyon
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  TachyonCore:
    path: TachyonCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Tachyon:
    type: application
    platform: iOS
    sources:
      - TachyonApp
    dependencies:
      - package: TachyonCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tachyon.ios
        INFOPLIST_FILE: TachyonApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
